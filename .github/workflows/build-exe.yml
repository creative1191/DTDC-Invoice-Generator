name: Build DTDC EXE
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: |
          pip install reportlab python-barcode Pillow pyinstaller customtkinter

      - name: Build Windows Executable
        run: |
          pyinstaller --onefile --windowed --name DTDC_Bill_Generator --add-data "public;assets" --collect-all barcode --hidden-import=barcode --hidden-import=barcode.writer --hidden-import=reportlab --hidden-import=PIL --hidden-import=customtkinter app_gui.py --clean -y

      - name: Upload Artifact
        uses: actions/upload-artifact@v4
        with:
          name: DTDC_Bill_Generator-Windows-EXE
          path: dist/DTDC_Bill_Generator.exe
