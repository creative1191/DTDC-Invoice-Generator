name: Build DTDC Offline EXE
on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build-windows:
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Node.js 20
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Install Node dependencies & Build Web App
        run: |
          npm ci || npm install
          npm run build

      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install Python build tools
        run: |
          pip install --upgrade pip
          pip install pywebview pyinstaller pythonnet

      - name: Build Standalone Windows Executable
        run: |
          pyinstaller dtdc_app.spec --clean -y

      - name: Verify EXE Exists
        shell: pwsh
        run: |
          if (Test-Path "dist/DTDC_Bill_Generator.exe") {
            Write-Host "Success: DTDC_Bill_Generator.exe created successfully!"
            Get-Item "dist/DTDC_Bill_Generator.exe" | Select-Object Name, Length, LastWriteTime
          } else {
            Write-Error "dist/DTDC_Bill_Generator.exe not found"
            exit 1
          }

      - name: Upload Artifact (DTDC_Bill_Generator.exe)
        uses: actions/upload-artifact@v4
        with:
          name: DTDC_Bill_Generator-Windows-EXE
          path: dist/DTDC_Bill_Generator.exe
