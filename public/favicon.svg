        <path d="M 254 8 L 314 8 C 348 8 364 25 364 55 C 364 85 348 102 314 102 L 254 102 Z M 284 29 L 284 81 L 310 81 C 329 81 336 72 336 55 C 336 38 329 29 310 29 Z" />

        <!-- 'C' -->
        <path d="M 466 31 L 438 41 C 430 29 417 24 399 24 C 374 24 358 37 358 55 C 358 73 374 86 399 86 C 417 86 430 81 438 69 L 466 79 C 452 96 429 104 399 104 C 357 104 329 80 329 55 C 329 30 357 6 399 6 C 429 6 452 14 466 31 Z" />
